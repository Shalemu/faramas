name: faramas
description: "A real estate app for Faramas"
publish_to: "none"
version: 23.3.3+13

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  video_player: ^2.10.0
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^10.6.0
  http: ^0.13.6
  provider: ^6.1.2
  url_launcher: ^6.3.2
  image_picker: ^1.0.0
  mime_type: ^1.0.0
  http_parser: ^4.0.2
  geolocator: ^14.0.1
  geocoding: ^4.0.0
  flutter_social_button: ^1.1.6+1
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.0
  intl: ^0.20.2
  google_maps_flutter: ^2.12.3
  flutter_map: ^4.0.0
  loading_animation_widget: ^1.3.0
  animate_do: ^4.2.0
  latlong2: ^0.8.2
  webview_flutter: ^4.13.0
  lottie: ^3.0.0
  android_intent_plus: ^5.3.0
  mime: ^2.0.0
  video_compress: ^3.1.4
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  awesome_dialog: ^3.3.0
  motion_toast: ^2.14.0
  flutter_image_compress: ^2.4.0
  get: ^4.7.3
  path: ^1.9.1
  cached_network_image: ^3.3.1
 


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/faramas_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/faramas_icon.jpg"
    background_color: "#ffffff"
    theme_color: "#0047AB"
  windows:
    generate: true
    image_path: "assets/icon/faramas_icon.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/faramas_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/support.jpg
    - assets/images/ads/
    - assets/logo/
    - assets/images/flags/
